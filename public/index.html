<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="YOLETECH | Data Analytics, Business Intelligence, Workflow Automation & Full-Stack Web Development."
    />
    <title>YOLETECH | Data Analytics, Business Intelligence &amp; Full-Stack Web Development</title>
    <link rel="icon" type="image/png" href="/assets/yoletech-icon.png" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('yoletech_theme');
          var theme = saved;
          if (!theme) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app-root"></div>
    <script src="/data.js"></script>
    <script src="/components.js"></script>
    <script src="/app.js"></script>
    <script src="/dashboard.js"></script>
  </body>
</html>
