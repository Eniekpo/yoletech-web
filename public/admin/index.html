<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>YOLETECH | Decap CMS Content Manager</title>
    <link rel="icon" type="image/png" href="/assets/yoletech-icon.png" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      body {
        margin: 0;
        background-color: #16133a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .yoletech-cms-bar {
        background: linear-gradient(90deg, #1e1b4b 0%, #2f2b73 100%);
        border-bottom: 2px solid #c8e61e;
        color: #ffffff;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
      }
      .yoletech-cms-bar a {
        color: #c8e61e;
        text-decoration: none;
        font-weight: 600;
        margin-left: 14px;
      }
      .yoletech-cms-bar .accent-lime {
        color: #c8e61e;
      }
      .yoletech-cms-bar .badge {
        background: rgba(200, 230, 30, 0.15);
        border: 1px solid #c8e61e;
        color: #c8e61e;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="yoletech-cms-bar">
      <div>
        <strong>YOLETECH</strong> <span class="accent-lime">Content Manager</span>
      </div>
      <div>
        <a href="/admin-dashboard">Admin Dashboard →</a>
        <a href="/blog">View Live Blog →</a>
      </div>
    </div>
    <!-- Decap CMS Core Script -->
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  </body>
</html>
