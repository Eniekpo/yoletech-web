# ============================================================================
# YOLETECH — Decap CMS Configuration (Powered by DecapBridge)
# Author: John Oruebi Eniekpo (https://github.com/Eniekpo)
# ============================================================================

# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: Eniekpo/yoletech-web
  branch: main
  identity_url: https://auth.decapbridge.com/sites/1a86cf6b-49bc-4204-8b06-4440ba635aca
  gateway_url: https://gateway.decapbridge.com

# See who did what (optional)
commit_messages:
  create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://yolestica.com
display_url: https://yolestica.com

media_folder: "public/assets/blog"
public_folder: "/assets/blog"

collections:
  - name: "portfolio"
    label: "YOLETECH Portfolio Projects"
    label_singular: "Portfolio Project"
    folder: "content/portfolio"
    create: true
    slug: "{{slug}}"
    preview_path: "portfolio"
    summary: "{{title}}"
    fields:
      - { label: "Project Title", name: "title", widget: "string", required: true }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Used to order projects; it is not shown on the portfolio card." }
      - label: "Category"
        name: "category"
        widget: "select"
        hint: "Used by the portfolio filters and the Build Similar button."
        options:
          - "Data Analytics & BI"
          - "Full-Stack Web"
          - "AI & Machine Learning"
          - "AI & Workflow Automation"
          - "Tech Tutorials & Training"
          - "Graphic Design & Video"
          - "IT & Customer Support"
        default: "Data Analytics & BI"
      - { label: "Project Card Image", name: "preview_image", widget: "image", choose_url: true, required: true, default: "/assets/dashboard-preview.jpg", hint: "Upload an image or insert an image URL." }
      - { label: "Live Demo Project URL (Optional)", name: "demo_url", widget: "string", required: false, hint: "Paste the live URL to your interactive demo, web app, Power BI/Tableau view, or deployed project" }
      - { label: "GitHub / Source Code URL (Optional)", name: "github_url", widget: "string", required: false, default: "https://github.com/Eniekpo" }
      - { label: "Feature on Home Page", name: "featured", widget: "boolean", default: true, hint: "Controls whether this project can appear in the featured project section on the home page." }

  - name: "blog"
    label: "YOLETECH Blog Articles"
    label_singular: "Blog Article"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    summary: "{{title}} — {{category}} ({{date}})"
    fields:
      - { label: "Article Title", name: "title", widget: "string", required: true }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Data Analytics & BI"
          - "Full-Stack Web Development"
          - "Python & Machine Learning"
          - "AI & Workflow Automation"
          - "Tech Tutorials & Mentorship"
        default: "Data Analytics & BI"
      - { label: "Read Time (e.g. 6 min read)", name: "readTime", widget: "string", default: "5 min read" }
      - { label: "Author", name: "author", widget: "string", default: "John Oruebi Eniekpo" }
      - { label: "Cover Image", name: "coverImage", widget: "image", choose_url: true, default: "/assets/dashboard-preview.jpg", hint: "Upload an image or insert an image URL." }
      - { label: "Executive Summary", name: "summary", widget: "text", required: true }
      - { label: "Tags (comma-separated)", name: "tags", widget: "list", default: ["Python", "Power BI", "SQL"] }
      - { label: "Featured Article", name: "featured", widget: "boolean", default: false }
      - { label: "Article Body (Markdown)", name: "body", widget: "markdown", required: true }
