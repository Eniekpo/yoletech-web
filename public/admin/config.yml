# ============================================================================
# YOLETECH — Decap CMS Configuration (Powered by Decap Bridge PKCE & Local Sync)
# Author: John Oruebi Eniekpo, B.Sc. (https://github.com/Eniekpo)
# ============================================================================

backend:
  name: github
  repo: Eniekpo/yoletech-web
  branch: main
  # Decap Bridge PKCE OAuth configuration for passwordless/serverless GitHub auth:
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/yoletech-web/pkce
  auth_token_endpoint: /sites/yoletech-web/token
  auth_type: pkce
  app_id: yoletech-decap-bridge-client

# Enables local Git/Markdown editing via YOLETECH built-in local backend API (/api/v1)
local_backend:
  url: http://localhost:4000/api/v1
  allowed_hosts:
    - localhost:4000
    - 127.0.0.1:4000

site_url: https://yolestica.com
display_url: https://yolestica.com
logo_url: /assets/yoletech-logo.png

media_folder: "public/assets/blog"
public_folder: "/assets/blog"

collections:
  - name: "blog"
    label: "YOLETECH Blog Articles"
    label_singular: "Blog Article"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}} ({{date}})"
    fields:
      - { label: "Article Title", name: "title", widget: "string", required: true }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Data Analytics & BI"
          - "Full-Stack Web Development"
          - "Python & Machine Learning"
          - "AI & Workflow Automation"
          - "Tech Tutorials & Mentorship"
        default: "Data Analytics & BI"
      - { label: "Read Time (e.g. 6 min read)", name: "readTime", widget: "string", default: "5 min read" }
      - { label: "Author", name: "author", widget: "string", default: "John Oruebi Eniekpo, B.Sc." }
      - { label: "Cover Image URL", name: "coverImage", widget: "string", default: "/assets/dashboard-preview.jpg" }
      - { label: "Executive Summary", name: "summary", widget: "text", required: true }
      - { label: "Tags (comma-separated)", name: "tags", widget: "list", default: ["Python", "Power BI", "SQL"] }
      - { label: "Featured Article", name: "featured", widget: "boolean", default: false }
      - { label: "Article Body (Markdown)", name: "body", widget: "markdown", required: true }
